# Options Trading Platform - Modern Architecture
# pyproject.toml

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "options-trading-platform"
version = "2.0.0"
description = "Modern options trading platform with Black-Scholes calculations and gamma scalping"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Data processing
    "pandas>=2.1.0",
    "numpy>=1.25.0",
    "scipy>=1.11.0",
    "polars>=0.20.0",  # High-performance alternative to pandas
    
    # HTTP clients
    "httpx>=0.25.0",
    "requests>=2.31.0",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    
    # Caching and queuing
    "redis>=5.0.0",
    "celery>=5.3.0",
    
    # Security and auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    
    # Configuration
    "python-dotenv>=1.0.0",
    "dynaconf>=3.2.0",
    
    # Logging and monitoring
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    
    # Time and timezone
    "pytz>=2023.3",
    "python-dateutil>=2.8.2",
    
    # File formats
    "pyarrow>=14.0.0",
    
    # Optional keyring support
    "keyring>=24.3.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",  # For testing FastAPI
    
    # Code quality
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    
    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
    
    # Development tools
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
]

ml = [
    # Machine learning
    "scikit-learn>=1.3.0",
    "mlflow>=2.8.0",
    "optuna>=3.4.0",
]

monitoring = [
    # Advanced monitoring
    "sentry-sdk[fastapi]>=1.38.0",
    "jaeger-client>=4.8.0",
    "opentelemetry-api>=1.21.0",
]

all = [
    "options-trading-platform[dev,ml,monitoring]"
]

[project.urls]
Homepage = "https://github.com/yourusername/options-trading-platform"
Documentation = "https://yourusername.github.io/options-trading-platform/"
Repository = "https://github.com/yourusername/options-trading-platform.git"
"Bug Tracker" = "https://github.com/yourusername/options-trading-platform/issues"

[project.scripts]
options-trading = "options_trading.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/options_trading"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["options_trading"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "keyring.*",
    "scipy.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=options_trading --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "auth: marks tests related to authentication",
    "api: marks tests related to API endpoints",
    "calculations: marks tests related to financial calculations",
]

[tool.coverage.run]
source = ["src/options_trading"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]