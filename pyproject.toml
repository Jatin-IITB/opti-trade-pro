[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optitrade-pro"
version = "3.0.0"
description = "OptiTrade Pro — derivatives pricing & risk engine: vol surfaces (spline + SABR), Greeks (analytic, finite-diff, adjoint AD), delta-neutral hedging with gamma scalping, and fail-closed pre-trade risk controls"
readme = "Readme.md"
license = { text = "MIT" }
authors = [{ name = "Jatin Gupta", email = "gjatin145@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.11"
# Core quant engine (optitrade) needs only numpy/scipy; the rest serves the
# options_trading platform layer (FastAPI app + Upstox integration).
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.0",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
    "psutil>=5.9.0",
    "pytz>=2023.3",
    "jinja2>=3.1.0",
    "itsdangerous>=2.1.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.98.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.0",
]
# Optional LLM-backed debate experts (governance module works without this;
# rule-based experts are the default). See docs/adr/010.
agentic = ["dspy>=2.5.0"]
# Optional MCP server exposing the engines as agent tools (ADR-015).
mcp = ["mcp>=1.2.0"]

[project.scripts]
optitrade = "optitrade.cli:main"
optitrade-mcp = "optitrade.mcp_server:main"

[project.urls]
Repository = "https://github.com/jatin-gupta/opti-trade-pro"

[tool.hatch.build.targets.wheel]
packages = ["src/optitrade", "src/options_trading"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "SIM108", # ternary is not always clearer
]
# Quant output legitimately uses Greek letters and math symbols in strings.
allowed-confusables = ["σ", "Γ", "Δ", "θ", "ρ", "ν", "α", "λ", "η", "×", "−", "μ"]

[tool.ruff.lint.per-file-ignores]
# Platform-layer debt, parked per ADR-004's incremental-tightening policy:
# B008 is FastAPI's Depends-in-default idiom; the rest are legacy style issues
# (exception chaining, late imports, unused locals, str-Enum) fixed as each
# module is refactored. Do not add rules here for new code.
"src/options_trading/**" = [
    "B008",
    "B904",
    "E402",
    "E731",
    "F841",
    "RUF006",
    "RUF059",
    "SIM102",
    "SIM105",
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["optitrade", "options_trading"]

[tool.mypy]
# numpy >= 2.5 stubs use PEP 695 `type` statements, so 3.12 is the checking floor.
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# src/__init__.py would otherwise give files a second module name (src.optitrade.*)
# clashing with the editable install's optitrade.*.
explicit_package_bases = true
mypy_path = ["src"]

# The quant core is held to strict typing.
[[tool.mypy.overrides]]
module = "optitrade.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true

# Platform layer predates the typing standard; tightened incrementally (ADR-004).
[[tool.mypy.overrides]]
module = "options_trading.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["keyring.*", "scipy.*", "pandas.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: long-running test (deselect with '-m \"not slow\"')",
    "integration: uses real services or network",
    "unit: fast, isolated unit test",
    "benchmark: performance-target test (scenario-grid latency, etc.)",
    "auth: authentication-related test",
]

[tool.coverage.run]
source = ["src/optitrade", "src/options_trading"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]
